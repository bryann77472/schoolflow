<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolFlow — Sua escola digital</title>
  <meta name="description" content="SchoolFlow: aulas, trabalhos e eventos organizados em um só lugar.">
  <meta name="theme-color" content="#f4f5fa">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('schoolflow.prefs.v1') || '{}');
        var theme = prefs.theme || 'system';
        if (theme === 'system') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.accent = prefs.accent || 'indigo';
        root.dataset.density = prefs.density || 'comfortable';
        root.dataset.motion = prefs.motion || 'full';
        root.dataset.vibrancy = prefs.vibrancy || 'super';
        root.dataset.contrast = prefs.contrast === 'high' ? 'high' : 'normal';

        var hasSession = false;
        try {
          hasSession = Boolean(localStorage.getItem('schoolflow.session.v1') || localStorage.getItem('loggedUser'));
        } catch (error) { hasSession = false; }
        window.location.replace(hasSession ? 'pages/dashboard.html' : 'pages/login.html');
      } catch (error) {
        window.location.replace('pages/login.html');
      }
    })();
  </script>
</head>
<body>
  <main class="splash-screen">
    <div class="splash-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </span>
      <span class="splash-name">School<span>Flow</span></span>
    </div>
    <div class="splash-loader" aria-hidden="true"><span></span></div>
    <p>Preparando seu fluxo de estudos…</p>
    <noscript>
      <p style="margin-top:14px">Ative o JavaScript para usar o SchoolFlow.</p>
      <p><a href="pages/login.html">Ir para o login</a></p>
    </noscript>
  </main>
</body>
</html>
