<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolFlow - Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="dashboard.html" class="logo">SchoolFlow</a>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="assignments.html">Trabalhos</a></li>
          <li><a href="events.html">Eventos</a></li>
          <li><a href="admin.html" class="active">Admin</a></li>
        </ul>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"></button>
        <div class="avatar-container" onclick="toggleDropdown()">
          <span id="avatar-letter"></span>
          <div class="dropdown-menu" id="user-dropdown">
            <a onclick="logout()">Logout</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="header">
        <h1>Painel Administrativo</h1>
        <div class="user-info">
          <span class="name" id="user-name"></span>
          <span class="role" id="user-role"></span>
        </div>
      </div>

      <!-- Users Section -->
      <section class="assignments-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Usuários</h2>
          <button class="btn btn-primary" onclick="openAddUserModal()">Adicionar Usuário</button>
        </div>
        
        <table class="admin-table" id="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Role</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </section>

      <!-- Classes Section -->
      <section class="events-section">
        <h2>Turmas</h2>
        
        <table class="admin-table" id="classes-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Dia</th>
              <th>Horário</th>
              <th>Sala</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <!-- Add User Modal -->
  <div class="modal" id="add-user-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Adicionar Usuário</h2>
        <button class="modal-close" onclick="closeAddUserModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="add-user-form">
          <div class="form-group">
            <label>Nome</label>
            <input type="text" id="user-name" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="user-email" required>
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="user-role" required>
              <option value="aluno">Aluno</option>
              <option value="professor">Professor</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeAddUserModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="addUser()">Adicionar</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      
      document.getElementById('user-name').textContent = state.currentUser.name;
      document.getElementById('user-role').textContent = state.currentUser.role;
      document.getElementById('avatar-letter').textContent = state.currentUser.name.charAt(0).toUpperCase();
      
      if (state.currentUser.role !== 'admin') {
        alert('Acesso restrito a administradores');
        window.location.href = 'dashboard.html';
        return;
      }
      
      updateThemeToggle();
      const theme = localStorage.getItem('theme') || 'light';
      applyTheme(theme);
    });
  </script>
</body>
</html>
