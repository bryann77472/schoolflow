<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos — SchoolFlow</title>
  <meta name="description" content="Calendário escolar com eventos, categorias, confirmação de presença e agenda detalhada.">
  <meta name="theme-color" content="#f4f5fa">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('schoolflow.prefs.v1') || '{}');
        var theme = prefs.theme || 'system';
        if (theme === 'system') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.accent = prefs.accent || 'indigo';
        root.dataset.density = prefs.density || 'comfortable';
        root.dataset.motion = prefs.motion || 'full';
        root.dataset.vibrancy = prefs.vibrancy || 'super';
        root.dataset.contrast = prefs.contrast === 'high' ? 'high' : 'normal';
      } catch (error) { /* preferências indisponíveis */ }
    })();
  </script>
</head>
<body data-page="events">
  <div class="app-shell">
    <div id="sidebar-root" class="sidebar-root"></div>
    <div class="app-main">
      <div id="topbar-root" class="topbar-root"></div>
      <main id="page" class="page" aria-live="polite"></main>
      <div id="mobile-nav-root"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript-note">O SchoolFlow precisa de JavaScript para funcionar. Ative o JavaScript no seu navegador.</div>
  </noscript>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
