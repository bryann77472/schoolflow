<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolFlow - Login</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-screen">
  <div class="login-card">
    <h1>SchoolFlow</h1>
    <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem;">Bem-vindo à sua escola digital</p>
    
    <form id="login-form" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="exemplo@escola.com" required>
      </div>
      
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" required>
      </div>
      
      <div class="role-switch">
        <button type="button" class="role-btn" data-role="aluno">Aluno</button>
        <button type="button" class="role-btn" data-role="professor">Professor</button>
        <button type="button" class="role-btn" data-role="admin">Admin</button>
      </div>
      
      <button type="submit" style="margin-top: 1rem;">Entrar</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center;">
      <p style="font-size: 0.85rem; color: var(--text-secondary);">Contas de demonstração:</p>
      <div style="margin-top: 0.5rem; font-size: 0.78rem;">
        <p>Aluno: carlos@aluno.com / aluno123</p>
        <p>Professor: ana@professor.com / prof123</p>
        <p>Admin: admin@escola.com / admin123</p>
      </div>
    </div>
    
    <div class="theme-toggle-container">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" style="margin-top: 1rem;"></button>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    // Initialize theme on load
    document.addEventListener('DOMContentLoaded', () => {
      const theme = localStorage.getItem('theme') || 'light';
      applyTheme(theme);
      
      // Setup role buttons
      const roleBtns = document.querySelectorAll('.role-btn');
      roleBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          roleBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
        });
      });
      
      // Default to aluno
      if (roleBtns.length > 0) roleBtns[0].classList.add('active');
    });
  </script>
</body>
</html>
