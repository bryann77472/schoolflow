<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolFlow - Trabalhos</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="dashboard.html" class="logo">SchoolFlow</a>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="assignments.html" class="active">Trabalhos</a></li>
          <li><a href="events.html">Eventos</a></li>
          <li><a href="admin.html" id="admin-link" style="display: none;">Admin</a></li>
        </ul>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"></button>
        <div class="avatar-container" onclick="toggleDropdown()">
          <span id="avatar-letter"></span>
          <div class="dropdown-menu" id="user-dropdown">
            <a onclick="logout()">Logout</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="header">
        <h1>Trabalhos</h1>
        <div class="user-info">
          <span class="name" id="user-name"></span>
          <span class="role" id="user-role"></span>
        </div>
      </div>

      <section class="assignments-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Trabalhos</h2>
          <button class="btn btn-primary" onclick="openAssignmentModal()">Adicionar Trabalho</button>
        </div>
        
        <div id="assignments-container" style="margin-top: 1.5rem;"></div>
      </section>
    </div>
  </main>

  <!-- Assignment Modal -->
  <div class="modal" id="assignment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Novo Trabalho</h2>
        <button class="modal-close" onclick="closeAssignmentModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="assignment-form">
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="assignment-title" required>
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="assignment-desc"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Data de Entrega</label>
              <input type="date" id="assignment-due" required>
            </div>
            <div class="form-group">
              <label>Aula</label>
              <select id="assignment-class" required>
                <option value="">Selecione uma aula</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeAssignmentModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveAssignment()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      
      document.getElementById('user-name').textContent = state.currentUser.name;
      document.getElementById('user-role').textContent = state.currentUser.role;
      document.getElementById('avatar-letter').textContent = state.currentUser.name.charAt(0).toUpperCase();
      
      if (state.currentUser.role === 'admin') {
        document.getElementById('admin-link').style.display = 'inline-block';
      }
      
      renderAssignmentsPage();
      populateClassSelect();
      updateThemeToggle();
      
      // Load saved theme
      const theme = localStorage.getItem('theme') || 'light';
      applyTheme(theme);
    });
  </script>
</body>
</html>
